<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Solo</title>
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M12 3v18M4.5 7.5 12 12l7.5-4.5M4.5 16.5 12 12l7.5 4.5'/%3E%3C/svg%3E" />
		
		<script>
			// 首帧定色：放在样式之前同步执行，否则会先白一下再变深。
			(() => {
				try {
					const saved = localStorage.getItem("solo.theme") || "system";
					const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.dataset.theme = dark ? "dark" : "light";
					document.documentElement.style.colorScheme = dark ? "dark" : "light";
					document.body.dataset.layout = localStorage.getItem("solo.layout") || "flat";
				} catch {
					document.documentElement.dataset.theme = "light";
				}
			})();
		</script>
		<script type="module" crossorigin src="/assets/index-BJiLsPSd.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/index-DIXXsUro.css">
	</head>
	<body data-pane="list" data-layout="flat" data-side="open">
		<div id="root"></div>
	</body>
</html>
