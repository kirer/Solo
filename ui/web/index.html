<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>频道</title>
		<link rel="stylesheet" href="css/app.css" />
	</head>
	<body data-pane="list">
		<header class="top">
			<div class="brand">频道 <small id="company-meta"></small></div>
			<div class="top-spacer"></div>
			<button class="top-btn" id="team-btn" type="button" aria-expanded="false" aria-haspopup="dialog" title="团队：谁在哪个项目、什么职位（Esc 关闭）">团队</button>
			<button class="icon-btn" id="refresh" type="button" title="刷新" aria-label="刷新">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" />
				</svg>
			</button>
		</header>

		<div class="layout">
			<aside class="list">
				<div class="list-head">
					<b>频道</b>
					<span id="unread-total"></span>
				</div>
				<div class="rows" id="rows"></div>
			</aside>

			<main class="pane" id="pane">
				<div class="pane-head">
					<button class="icon-btn" id="back" type="button" title="返回" aria-label="返回">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M15 18l-6-6 6-6" />
						</svg>
					</button>
					<div>
						<h1 id="pane-title">选择一个频道</h1>
						<div class="pane-sub" id="pane-sub"></div>
					</div>
				</div>

				<div class="flow" id="flow">
					<div class="flow-inner" id="flow-inner">
						<div class="empty">左边选一个频道开始</div>
					</div>
				</div>

				<div class="reply-bar" id="reply-bar" hidden>
					<span id="reply-text"></span>
					<button class="icon-btn" id="reply-cancel" type="button" title="取消引用" aria-label="取消引用">✕</button>
				</div>

				<form class="composer" id="composer" hidden>
					<div class="composer-inner">
						<textarea
							id="input"
							rows="1"
							placeholder="发消息…（@ 提人）"
							aria-label="消息输入"
						></textarea>
						<button class="send" id="send" type="submit">发送</button>
					</div>
				</form>
			</main>
		</div>

		<div class="mention-pop" id="mention-pop" hidden></div>
		<div id="toast-root"></div>

		<section class="team" id="team" hidden>
			<div class="team-panel" id="team-panel" role="dialog" aria-modal="true" aria-labelledby="team-title" tabindex="-1">
				<header class="team-head">
					<h2 id="team-title">团队</h2>
					<span class="team-count" id="team-count"></span>
					<div class="team-spacer"></div>
					<button class="icon-btn" id="team-close" type="button" title="关闭（Esc）" aria-label="关闭团队视图">✕</button>
				</header>
				<div class="team-list" id="team-list"></div>
				<p class="team-foot">一人一行：姓名 · 职位 · 项目 · 向谁汇报。按「离老板最近」排序，左侧色条是项目。</p>
			</div>
		</section>

		<script type="module" src="js/app.js"></script>
	</body>
</html>
