<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Solo</title>
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.4' fill='%231c1b19'/%3E%3Cg transform='rotate(-28 12 12)'%3E%3Cellipse cx='12' cy='12' rx='7.8' ry='3.1' fill='none' stroke='%23f2e9d8' stroke-width='1.4' opacity='0.5'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='3.3' fill='%23f2e9d8'/%3E%3C/svg%3E" />
		
		<script>
			// 首帧定色：放在样式之前同步执行，否则会先白一下再变深。
			(() => {
				try {
					const saved = localStorage.getItem("solo.theme") || "system";
					const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.dataset.theme = dark ? "dark" : "light";
					document.documentElement.style.colorScheme = dark ? "dark" : "light";
					document.body.dataset.layout = localStorage.getItem("solo.layout") || "flat";
				} catch {
					document.documentElement.dataset.theme = "light";
				}
			})();
		</script>
		<script type="module" crossorigin src="/assets/index-BuwIAB10.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/index-CxPHh9nB.css">
	</head>
	<body data-pane="list" data-layout="flat" data-side="open">
		<div id="root"></div>
	</body>
</html>
