<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Solo</title>
		<!-- 首帧定色：这一段必须同步、必须在第一个 <link> 之前跑。module 是 defer 的，
		     等它跑到页面已经用浅色画完一帧，刷新时就是一下白闪。这里只读盘 + matchMedia，
		     落一个 data-theme，颜色全由 base.css 里那一组 token 决定。 -->
		<script>
			(function () {
				var mode = "system";
				try {
					mode = localStorage.getItem("ai-company.theme") || "system";
				} catch (e) {
					/* 隐私模式下读不到盘，当作跟随系统 */
				}
				var dark =
					mode === "dark" ||
					(mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
			})();
		</script>
		<link rel="stylesheet" href="css/base.css" />
		<link rel="stylesheet" href="css/shell.css" />
		<link rel="stylesheet" href="css/stream.css" />
		<link rel="stylesheet" href="css/pending.css" />
		<link rel="stylesheet" href="css/composer.css" />
		<link rel="stylesheet" href="css/motion.css" />
		<link rel="stylesheet" href="css/theme.css" />
	</head>
	<body data-pane="list" data-layout="flat">
		<div class="frame">
			<!-- 顶栏 48：左 = 产品标记 + 名字 + 公司；右 = 断线提示 + N 件找你 + 菜单 + 刷新。与侧栏之间不画线。 -->
			<header class="topbar">
				<span class="brand">
					<svg class="brand-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
						<circle cx="9" cy="9" r="7.2" fill="none" stroke="currentColor" stroke-width="1.5" />
						<path d="M9 3.6v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
					</svg>
					<h1 class="brand-name" id="bar-title">Solo</h1>
				</span>
				<span class="company-meta" id="company-meta"></span>
				<span class="topbar-grow"></span>
				<span class="conn" id="conn" hidden></span>
				<button class="need" id="unread-total" type="button" title="跳到下一条需要你的事"></button>
				<button class="icon-btn" id="team-btn" type="button" aria-expanded="false" aria-haspopup="dialog" title="团队：谁在哪个项目、什么职位（Esc 关闭）" aria-label="团队">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="9" cy="8.5" r="3.2" />
						<path d="M3.2 19.5c0-3 2.6-5 5.8-5s5.8 2 5.8 5" />
						<path d="M16.4 6.1a3.2 3.2 0 0 1 0 6.2M17.6 14.9c1.9.4 3.2 1.7 3.2 3.6" />
					</svg>
				</button>
				<div class="menu-anchor">
					<button class="icon-btn" id="menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="布局">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
							<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
						</svg>
					</button>
				</div>
				<button class="icon-btn" id="refresh" type="button" title="刷新" aria-label="刷新">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
						<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" />
					</svg>
				</button>
			</header>

			<aside class="sidebar" id="sidebar">
				<!-- 一个平铺的会话列表：群、项目、每个人的私聊，全在一列里，按最后说话时间排。
				     不分「成员 / 频道」两组 —— 同一个人在两处出现两次，读起来要自己对齐。 -->
				<div class="channels" id="rows"></div>
			</aside>

			<main class="sheet" id="sheet">
				<div class="sheet-head">
					<button class="icon-btn back" id="back" type="button" title="返回" aria-label="返回频道列表">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
							<path d="M15 18l-6-6 6-6" />
						</svg>
					</button>
					<h2 class="pane-title" id="pane-title">频道</h2>
					<span class="sheet-sub" id="pane-sub"></span>
					<span class="sheet-grow"></span>
					<!-- 详情：私聊看这个人，群看这个群。DS-BOT 那个位置就是这个东西。 -->
					<button class="icon-btn" id="detail-btn" type="button" title="详情" aria-label="详情">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="8.6" />
							<path d="M12 10.6v6M12 7.7v.1" />
						</svg>
					</button>
				</div>

				<div class="flow" id="flow">
					<div class="flow-inner" id="flow-inner">
						<!-- 上滑加载更早的哨兵：IntersectionObserver 只盯它，渲染时原样保留。 -->
						<div id="flow-top"></div>
						<!-- 首屏骨架：与最终行同尺寸的灰色实心条，不做 shimmer，数据到达不跳位。 -->
						<div class="skel" id="skel" aria-hidden="true">
							<div class="sk-row">
								<span class="sk-av"></span>
								<div class="sk-body"><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span></div>
							</div>
							<div class="sk-row">
								<span class="sk-av"></span>
								<div class="sk-body"><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span></div>
							</div>
							<div class="sk-row">
								<span class="sk-av"></span>
								<div class="sk-body"><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span><span class="sk-bar"></span></div>
							</div>
						</div>
						<div class="feed" id="feed"></div>
						<!-- 活动行：谁在干什么。永远只有一行，常驻节点，JS 只改文案与显隐。 -->
						<div class="act" id="act" hidden>
							<span class="act-av"></span>
							<span class="act-text"></span>
							<span class="act-time"></span>
						</div>
					</div>
					<!-- 不钉在底部时才出现：告诉你有几条新的，点一下跳回去。
					     没有它，往上翻看历史的人不知道下面来了消息，也不敢滚回去。 -->
					<button class="to-bottom" id="to-bottom" type="button" hidden>
						<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
							<path d="M12 5v14M6 13l6 6 6-6" />
						</svg>
						<span>回到最新</span>
					</button>
				</div>

				<div class="reply" id="reply-bar" hidden>
					<span class="reply-text" id="reply-text"></span>
					<button class="icon-btn reply-x" id="reply-cancel" type="button" title="取消引用" aria-label="取消引用">✕</button>
				</div>

				<form class="composer" id="composer" hidden>
					<input class="sr-only" id="file-input" type="file" multiple tabindex="-1" aria-hidden="true" />
					<div class="attach-tray" id="attach-tray" hidden></div>
					<div class="composer-card">
						<button class="plus" id="plus-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="更多" aria-label="更多">
							<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
								<path d="M8 3.2v9.6M3.2 8h9.6" />
							</svg>
						</button>
						<textarea id="input" rows="1" placeholder="发消息…（@ 提人）" aria-label="消息输入"></textarea>
						<button class="send" id="send" type="submit" disabled>发送</button>
					</div>
				</form>
			</main>
		</div>

		<div class="need-menu pop-menu" id="need-menu" role="menu" hidden></div>

		<div class="menu pop-menu" id="layout-menu" role="menu" hidden>
			<button class="menu-item" type="button" role="menuitemradio" data-layout="flat" aria-checked="true">
				<span class="menu-tick">✓</span>平铺
			</button>
			<button class="menu-item" type="button" role="menuitemradio" data-layout="bubble" aria-checked="false">
				<span class="menu-tick">✓</span>气泡
			</button>
		</div>

		<div class="menu pop-menu" id="plus-menu" role="menu" hidden>
			<button class="menu-item" type="button" role="menuitem" data-plus="image">
				<span class="menu-tick">›</span>发图片
			</button>
			<button class="menu-item" type="button" role="menuitem" data-plus="file">
				<span class="menu-tick">›</span>发文件
			</button>
			<button class="menu-item" type="button" role="menuitem" data-plus="quote">
				<span class="menu-tick">›</span>引用最后一条
			</button>
		</div>

		<div class="mention" id="mention-pop" hidden>
			<span class="mention-thumb" id="mention-thumb"></span>
			<div class="mention-list" id="mention-list"></div>
		</div>

		<div id="toast-root"></div>

		<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片" hidden>
			<img id="lightbox-img" alt="" />
		</div>

		<section class="detail" id="detail" hidden>
			<div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-name" tabindex="-1">
				<div class="detail-body" id="detail-body"></div>
			</div>
		</section>

		<section class="team" id="team" hidden>
			<div class="team-panel" id="team-panel" role="dialog" aria-modal="true" aria-labelledby="team-title" tabindex="-1">
				<header class="team-head">
					<h2 id="team-title">团队</h2>
					<span class="team-count" id="team-count"></span>
					<span class="sheet-grow"></span>
					<button class="icon-btn" id="team-close" type="button" title="关闭（Esc）" aria-label="关闭团队视图">✕</button>
				</header>
				<div class="team-list" id="team-list"></div>
				<p class="team-foot">一人一行：姓名 · 职位 · 项目 · 向谁汇报。按「离老板最近」排序。</p>
			</div>
		</section>

		<!-- 主题按钮单独一个入口：app.js 不动，主题也不进 app.js 的启动路径。 -->
		<script type="module">
			import { installTheme } from "./js/theme.js";
			installTheme();
		</script>
		<script type="module" src="js/app.js"></script>
	</body>
</html>
