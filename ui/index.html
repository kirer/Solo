<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0b0c0e">
	<meta name="color-scheme" content="dark light">
	<title>一人公司</title>
	<script>
		(function () {
			try {
				var params = new URLSearchParams(location.search);
				var stored = localStorage.getItem("ai-company.theme");
				var mode = params.get("theme") || stored || "system";
				if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
				var resolved = mode === "system"
					? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
					: mode;
				var root = document.documentElement;
				root.dataset.theme = mode;
				root.dataset.resolved = resolved;
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", resolved === "light" ? "#f5f5f2" : "#0b0c0e");
			} catch (error) {}
		})();
	</script>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/shell.css">
	<link rel="stylesheet" href="css/graph.css">
	<link rel="stylesheet" href="css/chat.css">
	<link rel="stylesheet" href="css/settings.css">
	<link rel="stylesheet" href="css/board.css">
	<link rel="stylesheet" href="css/motion.css">
</head>
<body data-chat="open" data-sheet="closed">
	<div class="app">
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 20 20" fill="none">
						<path d="M10 4.2v3.1M10 7.3 4.4 12.1M10 7.3l5.6 4.8M10 7.3v6.6" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
						<circle cx="10" cy="3" r="1.55" fill="currentColor"/>
						<circle cx="4.1" cy="13.4" r="1.55" fill="currentColor"/>
						<circle cx="10" cy="15.6" r="1.55" fill="currentColor"/>
						<circle cx="15.9" cy="13.4" r="1.55" fill="currentColor"/>
					</svg>
				</span>
			</div>

			<span class="topbar-summary" id="stage-sub"></span>

			<div class="topbar-actions">
				<span class="topbar-conn" id="conn" data-state="on" hidden><i></i>重连中</span>
				<!-- 看板 / 组织图 视图切换（单页面，不做侧边导航） -->
				<div class="view-switch" role="tablist" aria-label="视图">
					<button class="view-switch-btn" type="button" role="tab" id="view-org" aria-selected="true" title="组织架构">组织</button>
					<button class="view-switch-btn" type="button" role="tab" id="view-board" aria-selected="false" title="任务看板">看板</button>
				</div>
				<button class="topbar-btn" type="button" id="chat-toggle" aria-label="对话面板" aria-pressed="true" title="对话面板（⌘J）">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M20 12.5a7.6 7.6 0 0 1-8 7.5 8.8 8.8 0 0 1-2.6-.4L4 21l1.4-4.1A7.3 7.3 0 0 1 4 12.5 7.6 7.6 0 0 1 12 5a7.6 7.6 0 0 1 8 7.5Z"/>
					</svg>
				</button>
				<button class="topbar-btn" type="button" id="settings-toggle" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" title="设置">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="12" cy="12" r="3"/>
						<path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
					</svg>
				</button>
			</div>
		</header>

		<div class="workspace">
			<main class="stage" id="stage">
				<div class="stage-bg" id="stage-bg" aria-hidden="true"></div>
				<div class="stage-inner">
					<section class="org" aria-label="组织架构">
						<div class="graph" id="graph">
							<div class="graph-loading"><i></i>正在连接公司…</div>
						</div>
					</section>
					<!-- 任务看板：内容由 ui/js/board.js 渲染，容器宽度/切换由本文件与 shell.css 负责 -->
					<section class="board" id="board" aria-label="任务看板" hidden>
						<div class="board-inner" id="board-inner"></div>
					</section>
				</div>
			</main>

			<div class="chat-resizer" id="chat-resizer" role="separator" aria-orientation="vertical" aria-label="拖动调整对话面板宽度" title="拖动调整宽度 · 双击复位" tabindex="0"></div>

			<aside class="chat" id="chat" aria-label="对话">
				<header class="chat-head">
					<div class="chat-ident">
						<span class="avatar avatar--lg" id="chat-avatar" aria-hidden="true">·</span>
						<div class="chat-meta">
							<div class="chat-title-row">
								<b class="chat-title" id="chat-title">选择一位同事</b>
								<span class="pill" id="chat-status" data-state="idle"><i></i><span id="chat-status-text">空闲</span></span>
							</div>
							<div class="chat-role" id="chat-role">点组织图里的任意卡片</div>
						</div>
					</div>
					<div class="chat-actions">
						<span class="chat-token-count" id="chat-tokens" title="本会话 token"></span>
						<button class="icon-btn" type="button" id="chat-fold" aria-label="查看角色档案" title="查看角色档案（提示词与技能）" aria-haspopup="dialog" aria-expanded="false" hidden>
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="m6 9 6 6 6-6"/>
							</svg>
						</button>
						<button class="icon-btn chat-collapse-desktop" type="button" id="chat-collapse" aria-label="收起对话" title="收起对话">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="m9 5 7 7-7 7"/>
							</svg>
						</button>
						<button class="icon-btn chat-close-mobile" type="button" id="chat-close" aria-label="关闭对话" title="关闭对话">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M6 6l12 12M18 6 6 18"/>
							</svg>
						</button>
					</div>
				</header>

				<!-- 角色档案 / 预置词 / 能力：与对话面板同宽，在标题栏展开收起（不悬浮） -->
				<div class="chat-dock" id="chat-dock" hidden></div>

				<div class="chat-pending" id="ask-area"></div>

				<div class="chat-body" id="chat-body" role="log" aria-live="polite" aria-label="对话内容" tabindex="0"></div>

				<footer class="chat-foot">
					<form class="composer" id="composer" autocomplete="off">
						<label class="sr-only" for="input">消息</label>
						<!-- 附件托盘：文件 / 粘贴图片（内容由 ui/js/chat.js 渲染） -->
						<div class="attach-tray" id="attach-tray" hidden></div>
						<div class="composer-main">
							<button class="icon-btn composer-attach" type="button" id="attach" aria-label="添加附件" title="添加附件（支持粘贴图片、拖入文件）">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/>
								</svg>
							</button>
							<textarea id="input" rows="1" placeholder="说点什么…（@ 找人，可粘贴图片）" enterkeyhint="send"></textarea>
							<button class="send" id="send" type="submit" aria-label="发送" disabled>
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>
								</svg>
							</button>
						</div>
						<input type="file" id="file-input" hidden multiple>
						<!-- @ 提及弹层：内容由 ui/js/chat.js 渲染，位置相对输入框 -->
						<div class="mention-pop" id="mention-pop" hidden></div>
					</form>
				</footer>
			</aside>
		</div>
	</div>

	<div class="profile-layer" id="profile-layer" hidden></div>

	<div class="settings" id="settings" role="dialog" aria-modal="false" aria-label="设置" hidden>
		<header class="settings-head">
			<b>设置</b>
			<button class="icon-btn" type="button" id="settings-close" aria-label="关闭设置">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M6 6l12 12M18 6 6 18"/>
				</svg>
			</button>
		</header>

		<section class="settings-sec">
			<h3>外观</h3>
			<div class="settings-theme" role="radiogroup" aria-label="外观">
				<button type="button" role="radio" data-theme-option="dark" aria-checked="false">深色</button>
				<button type="button" role="radio" data-theme-option="light" aria-checked="false">浅色</button>
				<button type="button" role="radio" data-theme-option="system" aria-checked="false">跟随系统</button>
			</div>
		</section>

		<section class="settings-sec">
			<h3>模型</h3>
			<p class="settings-row">
				<span>默认模型</span>
				<span class="mono settings-value" id="company-model">—</span>
			</p>
			<!-- 模型清单与「添加模型」：由 ui/js/settings.js 渲染（/api/settings、/api/models） -->
			<div class="settings-models" id="settings-models"></div>
		</section>

		<section class="settings-sec">
			<h3>IM 连接</h3>
			<!-- 微信 / 企微 / 飞书 等接入配置：由 ui/js/settings.js 渲染（/api/settings 的 im 段） -->
			<div class="settings-im" id="settings-im"></div>
		</section>

		<section class="settings-sec">
			<h3>访问</h3>
			<!-- 局域网地址 / 端口：由 ui/js/settings.js 渲染（/api/settings 的 network 段） -->
			<div class="settings-network" id="settings-network"></div>
		</section>

		<section class="settings-sec">
			<h3>成本</h3>
			<p class="settings-row">
				<span>全公司</span>
				<span class="settings-value" id="settings-cost">—</span>
			</p>
		</section>
	</div>

	<div class="scrim" id="scrim" hidden></div>

	<script type="module" src="js/app.js"></script>
</body>
</html>
