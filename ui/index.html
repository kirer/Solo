<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0b0c0e">
	<meta name="color-scheme" content="dark light">
	<title>一人公司</title>
	<script>
		(function () {
			try {
				var params = new URLSearchParams(location.search);
				var stored = localStorage.getItem("ai-company.theme");
				var mode = params.get("theme") || stored || "system";
				if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
				var resolved = mode === "system"
					? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
					: mode;
				var root = document.documentElement;
				root.dataset.theme = mode;
				root.dataset.resolved = resolved;
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", resolved === "light" ? "#f5f5f2" : "#0b0c0e");
			} catch (error) {}
		})();
	</script>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/shell.css">
	<link rel="stylesheet" href="css/graph.css">
	<link rel="stylesheet" href="css/profile.css">
	<link rel="stylesheet" href="css/markdown.css">
	<link rel="stylesheet" href="css/trace.css">
	<link rel="stylesheet" href="css/settings.css">
	<link rel="stylesheet" href="css/board.css">
	<link rel="stylesheet" href="css/channels.css">
	<link rel="stylesheet" href="css/pending.css">
	<link rel="stylesheet" href="css/motion.css">
</head>
<body data-settings="closed" data-view="channels">
	<div class="app">
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 20 20" fill="none">
						<path d="M10 4.2v3.1M10 7.3 4.4 12.1M10 7.3l5.6 4.8M10 7.3v6.6" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
						<circle cx="10" cy="3" r="1.55" fill="currentColor"/>
						<circle cx="4.1" cy="13.4" r="1.55" fill="currentColor"/>
						<circle cx="10" cy="15.6" r="1.55" fill="currentColor"/>
						<circle cx="15.9" cy="13.4" r="1.55" fill="currentColor"/>
					</svg>
				</span>
			</div>

			<span class="topbar-summary" id="stage-sub"></span>

			<div class="topbar-actions">
				<span class="topbar-conn" id="conn" data-state="on" hidden><i></i>重连中</span>
				<!-- 看板 / 组织图 视图切换（单页面，不做侧边导航） -->
				<div class="view-switch" role="tablist" aria-label="视图">
					<button class="view-switch-btn" type="button" role="tab" id="view-org" aria-selected="false" title="组织架构">组织</button>
					<button class="view-switch-btn" type="button" role="tab" id="view-channels" aria-selected="true" title="频道">
						频道<span class="view-badge" id="ch-unread" hidden></span>
					</button>
					<button class="view-switch-btn" type="button" role="tab" id="view-board" aria-selected="false" title="任务看板">看板</button>
				</div>
				<button class="topbar-btn" type="button" id="settings-toggle" aria-label="设置" aria-controls="aside-slot" aria-expanded="false" title="设置">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="12" cy="12" r="3"/>
						<path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
					</svg>
				</button>
			</div>
		</header>

		<div class="workspace">
			<main class="stage" id="stage">
				<div class="stage-bg" id="stage-bg" aria-hidden="true"></div>
				<div class="stage-inner">
					<section class="org" id="org" aria-label="组织架构" hidden>
						<div class="graph" id="graph">
							<div class="graph-loading"><i></i>正在连接公司…</div>
						</div>
					</section>
					<!-- 频道：左侧频道列表 + 中间消息流 + 右侧成员/任务。内容由 ui/js/channels.js 渲染。 -->
					<section class="channels" id="channels" aria-label="频道">
						<div class="ch-layout">
							<nav class="ch-list" id="ch-list" aria-label="频道列表"></nav>
							<div class="ch-main">
								<header class="ch-head">
									<button class="ch-back" type="button" id="ch-back" aria-label="返回频道列表">
										<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
											<path d="M10 3.5 5.5 8l4.5 4.5"/>
										</svg>
										频道
									</button>
									<div class="ch-ident">
										<b class="ch-title" id="ch-title">频道</b>
										<span class="ch-sub" id="ch-sub"></span>
									</div>
									<!-- 成员栏开关（UX-6）：默认收起，点开才看。dm 频道由 channels.js 隐藏此按钮。 -->
									<div class="ch-head-side">
										<!-- 角色档案（#2）：与对话面板的 #chat-fold 同构，展开到下方 #ch-dock。
										     私聊里档案对象就是对方；群聊里是频道本身（成员清单）。 -->
										<button class="ch-side-toggle" type="button" id="ch-fold"
										        aria-label="角色档案" title="角色档案"
										        aria-controls="ch-dock" aria-expanded="false" hidden>
											<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
												<path d="m6 9 6 6 6-6"/>
											</svg>
										</button>
										<button class="ch-side-toggle" type="button" id="ch-side-toggle"
										        aria-label="成员" title="成员"
										        aria-controls="ch-side" aria-expanded="false">
											<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
												<circle cx="9" cy="8.2" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.5 14.2a5.2 5.2 0 0 1 3 4.4"/>
											</svg>
										</button>
									</div>
								</header>
								<!-- 角色档案（#4：侧边面板）。由 ui/js/profile.js 以 variant:"side" 渲染：
								     从右侧滑入，覆盖在会话区之上，不再把消息流顶下去。
								     桌面宽 340px，手机铺满（与成员栏浮层同一口径）。 -->
								<div class="ch-dock" id="ch-dock" hidden></div>
								<!-- #1 / #4：私聊不再有「对话 / 工作记录」分区。员工说过的话、想过的过程、
								     调过的工具全部混在一条时间线里，思考与工具调用默认折叠。 -->
								<div class="ch-body" id="ch-body" role="log" aria-label="消息流" tabindex="0"></div>
								<!-- #5：点消息弹出的操作浮窗（复制 / 引用回复）。定位由 channels.js 算，
								     固定挂在会话区里，不随消息重渲染而反复创建。 -->
								<div class="ch-msg-actions" id="ch-msg-actions" role="menu" aria-label="消息操作" hidden></div>
								<!-- 读屏播报只走这一小块：整个消息区挂 aria-live 的话，每次轮询
								     全量重渲染都会把整段历史重播一遍，读屏用户会被淹没。 -->
								<div class="sr-only" id="ch-announcer" role="status" aria-live="polite"></div>
								<div class="ch-compose">
									<div class="ch-mention-popup" id="ch-mention-popup" hidden></div>
									<!-- #5：引用回复的预览条（带取消）。发送时作为 `> 引用` 块写进正文。 -->
									<div class="ch-reply-bar" id="ch-reply-bar" hidden>
										<div class="ch-reply-text" id="ch-reply-text"></div>
										<button class="ch-reply-cancel" type="button" id="ch-reply-cancel" aria-label="取消引用">×</button>
									</div>
									<textarea id="ch-input" rows="1" aria-label="消息输入框" placeholder="发消息…（@ 提及，Enter 发送）"></textarea>
									<button class="ch-send" type="button" id="ch-send" aria-label="发送">发送</button>
								</div>
							</div>
							<aside class="ch-side" id="ch-side">
								<div class="ch-side-block">
									<h3>成员</h3>
									<ul class="ch-members" id="ch-members"></ul>
								</div>
								<div class="ch-side-block">
									<h3>任务</h3>
									<ul class="ch-tasks" id="ch-tasks"></ul>
								</div>
							</aside>
						</div>
					</section>

					<!-- 任务看板：内容由 ui/js/board.js 渲染，容器宽度/切换由本文件与 shell.css 负责 -->
					<section class="board" id="board" aria-label="任务看板" hidden>
						<div class="board-inner" id="board-inner"></div>
					</section>
				</div>
			</main>

			<!-- 设置：右侧抽屉。老板拍板去掉右侧对话面板之后，这块槽位只承载设置。
			     宽度由 --chat-w 驱动，body[data-settings="open|closed"] 控制展开。 -->
			<div class="aside-slot settings-slot" id="aside-slot">

			<section class="settings" id="settings" role="region" aria-label="设置">
				<header class="settings-head">
					<b>设置</b>
					<button class="icon-btn" type="button" id="settings-close" aria-label="关闭设置" title="关闭设置（Esc）">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M6 6l12 12M18 6 6 18"/>
						</svg>
					</button>
				</header>

				<section class="settings-sec">
					<h3>外观</h3>
					<div class="settings-theme" role="radiogroup" aria-label="外观">
						<button type="button" role="radio" data-theme-option="dark" aria-checked="false">深色</button>
						<button type="button" role="radio" data-theme-option="light" aria-checked="false">浅色</button>
						<button type="button" role="radio" data-theme-option="system" aria-checked="false">跟随系统</button>
					</div>
				</section>

				<section class="settings-sec">
					<h3>模型</h3>
					<p class="settings-row">
						<span>默认模型</span>
						<span class="mono settings-value" id="company-model">—</span>
					</p>
					<!-- 模型清单与「添加模型」：由 ui/js/settings.js 渲染（/api/settings、/api/models） -->
					<div class="settings-models" id="settings-models"></div>
				</section>

				<section class="settings-sec">
					<h3>IM 连接</h3>
					<!-- 微信 / 企微 / 飞书 等接入配置：由 ui/js/settings.js 渲染（/api/settings 的 im 段） -->
					<div class="settings-im" id="settings-im"></div>
				</section>

				<section class="settings-sec">
					<h3>访问</h3>
					<!-- 局域网地址 / 端口：由 ui/js/settings.js 渲染（/api/settings 的 network 段） -->
					<div class="settings-network" id="settings-network"></div>
				</section>

				<section class="settings-sec">
					<h3>成本</h3>
					<p class="settings-row">
						<span>全公司</span>
						<span class="settings-value" id="settings-cost">—</span>
					</p>
				</section>
			</section>
			</div>
		</div>
	</div>

	<div class="profile-layer" id="profile-layer" hidden></div>


	<script type="module" src="js/app.js"></script>
</body>
</html>
