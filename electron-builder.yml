# 桌面端打包（ADR-028 / ADR-029 / ADR-068）。
#
# 后端不打包、不 transpile：`src/` 的 TS 原样进包，用 Electron 自带的 Node 24 直接跑
# （类型擦除已稳定，`node:sqlite` 内置）。`ui/web` 与 `seed/` 一起放进去 —— 后端按
# `import.meta.url` 向上找它们的相对深度。
appId: com.solo.desktop
productName: Solo
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: desktop

files:
  - package.json
  # 主进程是 .js，preload 是 .cjs（沙箱 preload 只认 CommonJS，见 desktop/src/preload.cts）。
  - desktop/dist/**/*
  - src/**/*.ts
  - ui/web/**/*
  - seed/**/*
  # 瘦身（ADR-068）：运行时不需要 source map / SDK 的 TS 源码；Google 与 Bedrock
  # 的 provider 只在 pi-ai 目录里登记，Solo 的 APIS 表没有它们，SDK 又是 lazy import。
  - "!**/*.map"
  - "!node_modules/openai/src/**"
  - "!node_modules/@anthropic-ai/sdk/src/**"
  - "!node_modules/@google/genai/**"
  - "!node_modules/@aws-sdk/**"
  - "!node_modules/@smithy/**"
  - "!node_modules/protobufjs/**"
  - "!node_modules/web-streams-polyfill/**"
  - "!node_modules/google-auth-library/**"
  - "!node_modules/gaxios/**"
  - "!node_modules/node-fetch/**"
  - "!node_modules/fetch-blob/**"
  - "!node_modules/@earendil-works/pi-codemode/**"
  - "!node_modules/quickjs-wasi/**"
  - "!node_modules/@silvia-odwyer/**"

# Electron 只带三种语言：应用界面是中文，原生菜单 / 对话框留简繁和英文兜底。
# 55 个 .pak 是 48 MB，只留这三个是 1.7 MB。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW

# 压缩级别拉满：构建慢几分钟，换压缩包小几个百分点。
compression: maximum

# 不用 asar：播种技能用的是 `fs.cp(目录, …, {recursive:true})`，而 asar 的 fs 垫片只支持
# 拷「文件」，拷目录直接 NOT_FOUND（`seed/agents/assistant/skills/建立团队`）。放进 asar 要连带
# 改成逐文件拷贝，不值当；整份摊在 Resources/app 里一样能跑，排障还更好看。
asar: false

# 更新不再是 electron-updater 的发布通道：清单与签名由 `scripts/update-manifest.ts` 生成，
# 地址在 `desktop/src/feed.ts`（ADR-029）。所以这里不配 publish。
mac:
  icon: desktop/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

# macOS 的更新载体是 zip（装的是整个 .app），dmg 只给人手动装。
dmg:
  writeUpdateInfo: false

win:
  icon: desktop/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
