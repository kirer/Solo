name: 打包与发版

# 推 v* 标签（或在 Actions 页面手动运行）→ 检查 → mac arm64 / win x64 并行打包
# → 用仓库 secret SOLO_UPDATE_KEY 签更新清单 → 发 GitHub Release。
# 更新源就是本仓库的 Releases；发布顺序是二进制先传、清单最后传（ADR-029 / ADR-067）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 全局只有一个 latest，publish 必须全局串行，不要改成按 tag/分支分组的名字。
  # 只有再出现僵尸 run 占住并发组时，才把这里升一级（release-v3…），平时永远别动；
  # 改名的提交必须在下一版打 tag 之前进 main，否则那条 publish 用的还是旧组名。
  group: release-v2
  cancel-in-progress: false

# electron-builder 的辅助包（dmgbuild、7zip、winCodeSign、nsis）平时从 github.com 的
# releases 下；2026-11-09 连挂两轮 504。走 npmmirror 的只读镜像（和 npm 同一个源），
# runner 在境外也照常能取。
env:
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史指纹表那条测试要遍历全部 v2.* tag。
          # fetch-depth: 0 只保证历史提交，默认还带 --no-tags，只拉当前 ref 那一个 tag；
          # 必须再要 fetch-tags: true，否则 2.9.0-2.9.6 的历史 hash 会被判成硬塞的。
          fetch-depth: 0
          fetch-tags: true
      - name: 检查签名密钥
        env:
          SOLO_UPDATE_KEY: ${{ secrets.SOLO_UPDATE_KEY }}
        run: test -n "$SOLO_UPDATE_KEY" || { echo "缺少仓库 secret SOLO_UPDATE_KEY"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      # 指纹表测试要遍历历史 tag；这一行是给人看的凭据。
      # 判断口径（季衡 2026-11-11）：等于「本地推之前 git tag -l 'v2.*' | wc -l 的数 + 1」。
      # 加 1 是因为这一版自己的 tag 推上去才算数。别把具体数字记死，每版都会涨。
      # 数小了，下面那条测试就会把历史 hash 判成硬塞的。
      - name: 数一下拉到了几个 v2 tag
        run: git tag -l 'v2.*' | wc -l
      - run: npm run check
      - run: npm test
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      # dmg 偶尔会在 runner 上 hdiutil: create failed - Device not configured，
      # 是机器层面的瞬时问题；失败一次就重打一次，别让它挡住已经打好的 zip。
      - name: 打包（dmg 失败重试一次）
        run: |
          set -euo pipefail
          npm run desktop:dist:mac || {
            echo "第一次 macOS 打包失败，重试…"
            npm run desktop:dist:mac
          }
      # 出包之后真起一次：直接跑二进制（`open -g` 不行，launchd 不带环境变量），
      # 设置页里点一下「检查更新」，隔 20ms 以上回读 `status.at` 变大才算点通了
      # （Solo 2026-11-12 定的口径，脚本见 `scripts/verify-update-click.mjs`）。
      # 原生对话框由脚本自己设 `SOLO_VERIFY_NO_DIALOG=1` 关掉 —— runner 上没人点它。
      # `HOME=` 和 `--user-data-dir=` 都由脚本指到临时目录，不碰真实库。
      - name: 真机点一次「检查更新」
        run: |
          set -euo pipefail
          APP="release/mac-arm64/Solo.app/Contents/MacOS/Solo"
          if [ ! -x "$APP" ]; then
            echo "没找到打包出来的二进制：$APP"
            ls -l release || true
            exit 1
          fi
          mkdir -p update-click
          node scripts/verify-update-click.mjs --app "$APP" --out update-click
      # 证据不跟着「通过/失败」走：红了才更需要这张图和 log。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-update-click
          if-no-files-found: warn
          path: update-click/
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            release/Solo-${{ needs.verify.outputs.version }}-arm64.dmg
            release/Solo-${{ needs.verify.outputs.version }}-arm64.zip

  build-win:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史指纹表那条测试要遍历全部 v2.* tag。
          # fetch-depth: 0 只保证历史提交，默认还带 --no-tags，只拉当前 ref 那一个 tag；
          # 必须再要 fetch-tags: true，否则 2.9.0-2.9.6 的历史 hash 会被判成硬塞的。
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      # Windows 上再跑一遍：`defaultUiDir` 这类 `URL.pathname` 的路径差异只有这里会露。
      - run: npm test
      - run: npm run ui:build
      - run: npm run desktop:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          if-no-files-found: error
          path: |
            release/Solo-${{ needs.verify.outputs.version }}-x64.exe
            release/Solo-${{ needs.verify.outputs.version }}-x64.zip

  publish:
    needs: [verify, build-mac, build-win]
    # 只有「推 v* 标签」这一种触发才发版。手动运行（workflow_dispatch）落在分支上时，
    # 下面的 publish 会照 v<包版本> 去建 Release —— 等于把没打过标签的提交当版本发出去。
    # 手动跑只用来验打包，发布这条路必须由 tag 触发（2026-11-12 build-win 红那次发现的）。
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      SOLO_UPDATE_KEY: ${{ secrets.SOLO_UPDATE_KEY }}
    steps:
      # 全历史：本版改了什么（清单里的 notes / Release 正文）是从提交标题生成的，
      # 浅克隆读不到「上一个 tag..本 tag」那段（Solo 2026-11-12：手抄必然忘）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 标签与版本必须一致
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v${VERSION}"
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "标签 $TAG 和 package.json 的版本 $VERSION 不一致。"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # 一条命令出四份清单：两份 latest-*.json（带 notes）、plugins.json（插件清单）+ 插件包。
      # 格式只在 scripts/update-manifest.ts 一处改（别在这里手拼 JSON）。
      - name: 签更新清单与插件清单
        run: |
          set -euo pipefail
          if [ -z "${SOLO_UPDATE_KEY:-}" ]; then
            echo "缺少仓库 secret SOLO_UPDATE_KEY（更新签名私钥）。"
            exit 1
          fi
          # notes 是从提交标题生成的：先把「上一个 tag..本 tag」真的有提交这件事验一遍。
          # 浅克隆下这段是空的、而且不报错，弹窗就永远退回「有新版本」那句老文案（Solo 2026-11-12）。
          TAG="${{ steps.tag.outputs.tag }}"
          # `--exclude` 掉当前这个 tag：tag 就打在 HEAD 上时 describe 会返回它自己，
          # `prev..cur` 就是 0 行，这道红门每次都红（Solo 2026-11-12）。
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude="${TAG}" "${TAG}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "找不到 ${TAG} 之前的 v* tag：notes 无从生成，先确认 fetch-depth 和 tag。"
            exit 1
          fi
          COUNT="$(git log --oneline "${PREV}..${TAG}" | wc -l | tr -d ' ')"
          echo "上一个 tag ${PREV} → ${TAG}：${COUNT} 个提交"
          if [ "$COUNT" -eq 0 ]; then
            echo "区间里一个提交都没有：要么克隆太浅，要么 tag 打错了。notes 会是空数组，当场红。"
            exit 1
          fi
          printf '%s\n' "$SOLO_UPDATE_KEY" > "$RUNNER_TEMP/solo-update-key.pem"
          chmod 600 "$RUNNER_TEMP/solo-update-key.pem"
          mkdir -p feed
          node --experimental-strip-types scripts/update-manifest.ts \
            --feed feed --version "$VERSION" \
            --file darwin="dist/Solo-${VERSION}-arm64.zip" \
            --file win32="dist/Solo-${VERSION}-x64.zip" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --plugins-src plugins-src \
            --key "$RUNNER_TEMP/solo-update-key.pem"
          ls -l dist feed
      # 闸：正文空着就发，等于这一版对外什么都没说。v2.9.18 就是这么出的——功能全被塞进
      # `chore(版本): 2.9.18` 那一笔里，生成器只认 feat/fix 标题，正文就成了「这一版没有
      # feat / fix 提交」。这里把「notes 是空的」和「真的动了代码」对起来：两条同时成立就红。
      # 只动了 seed / 脚本 / 文档 / 测试的版本，notes 空着是正常的，放行。
      - name: 闸：notes 空着但真动了代码
        run: |
          set -euo pipefail
          if [ ! -f feed/release-notes.md ]; then
            echo "没有 feed/release-notes.md：清单那步没跑成？"
            exit 1
          fi
          if ! grep -q "这一版没有 feat / fix 提交" feed/release-notes.md; then
            echo "正文有内容："
            cat feed/release-notes.md
            exit 0
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude="${TAG}" "${TAG}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "找不到 ${TAG} 之前的 v* tag，这道闸判不了，先红。"
            exit 1
          fi
          # desktop/ 也算：2.9.18 的功能有一半在 examples 之外的那层（`desktop/src/updates.ts`），
          # 只盯 src/ 和 ui/ 会漏掉「功能只改了壳」的那种版本。
          CHANGED="$(git diff --name-only "${PREV}..${TAG}" -- src ui desktop | head -20)"
          if [ -n "$CHANGED" ]; then
            echo "正文是「这一版没有 feat / fix 提交」，但 ${PREV}..${TAG} 动了代码："
            echo "$CHANGED"
            echo "功能请单独一笔 feat(...) / fix(...)，标题才会进 Release 正文与更新弹窗。"
            echo "版本号那笔只碰数字（Solo 2026-11-14 定的规矩）。"
            exit 1
          fi
          echo "正文空着，但这版没动 src/ ui/ desktop/（只改了文档、脚本、seed、测试）：放行。"
      - name: 发版（二进制先传，清单最后传）
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$STATE" = "false" ]; then
            echo "发布 $TAG 已经正式发布过，拒绝覆盖；要重发请升版本。"
            exit 1
          fi
          if [ -z "$STATE" ]; then
            # 正文和清单里的 notes 是同一份：从提交标题生成，不手抄。
            gh release create "$TAG" --draft --title "Solo $VERSION" --notes-file feed/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" \
            "dist/Solo-${VERSION}-arm64.dmg" \
            "dist/Solo-${VERSION}-arm64.zip" \
            "dist/Solo-${VERSION}-x64.exe" \
            "dist/Solo-${VERSION}-x64.zip" \
            --clobber
          # 插件清单和插件包最后传：客户端按 plugins.json 去取 plugin-*.json，少一个就是下不下来。
          gh release upload "$TAG" \
            feed/latest-mac.json feed/latest-mac.json.sig \
            feed/latest-win.json feed/latest-win.json.sig \
            feed/plugins.json feed/plugins.json.sig \
            feed/plugin-orb.json feed/plugin-file-tree.json feed/plugin-im-bot.json \
            feed/plugin-token-stats.json feed/plugin-model-manager.json \
            --clobber
          gh release edit "$TAG" --draft=false --latest
