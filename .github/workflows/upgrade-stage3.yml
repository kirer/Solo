# 段 3（整链：自己下载、自己替换、自己重开）的专用通道。
#
# 为什么单独开一个：2026-11-15 它一天栽了三次在「读太早」，连着让发版的 build-mac 红掉，红的
# 还不是产品的问题。老板拍了把它从发版闸上摘下来 —— 连绿三次再挂回去（挂回去就是把
# `release.yml` 里 `SOLO_VERIFY_SEGMENT3` 那段和那条 `if` 删掉）。在那之前它是一条旁路：
# **手动跑这里，别挡发版**。
#
# 怎么跑：Actions → 段 3 升级验收 → Run workflow。
#   - `tag` 留空 = 用最近一个 `v*` tag；要验别的就填。
#   - `run_id` 填了就去捞那趟 release run 的 `mac-arm64` 产物，省掉重新打包（二十多分钟）。
#     留空就按 tag 现打一份。
name: 段 3 升级验收

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "验哪个 tag（留空 = 最近一个 v* tag）"
        required: false
      run_id:
        description: "可选：直接捞这趟 release run 的 mac-arm64 产物，别重新打包"
        required: false
      old_tag:
        description: "可选：从哪个已发布的版本升上来（如 v2.9.19，走用户真会走的那条路）。留空 = 拿本版包当替身改个版本号（只验稳不稳）"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  # 旁路就该有自己的组：跟发版共用 `release-v2` 会把推 main 那趟堵在后头（Solo 2026-11-15）。
  # 组内照样串行——一条链上同时跑两个升级验收，装来装去分不清是谁的锅。
  group: upgrade-stage3
  cancel-in-progress: false

jobs:
  stage3:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: 选版本
        id: pick
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            echo "没指定 tag，用最近一个：$TAG"
          fi
          # 别 `git checkout "$TAG"`：一 checkout，**验收脚本**也跟着回到那个版本，老脚本的 bug 会让
          # 结论失真。2026-11-15 就是这个坑 —— v2.9.20 里的 verify-upgrade.mjs 还没有「真实升级路径」
          # 那段，于是每趟都填了 `old_tag=v2.9.19`、bash 也把参数拼进去了，脚本照样走替身分支，
          # 连着三趟「绿」全是替身。**验的是那个 tag 的包，工具要用最新的**，所以只从 tag 里读版本号。
          VERSION=$(git show "${TAG}:package.json" | sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$VERSION" ]; then
            echo "${TAG}:package.json 里读不出 version"
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG 和 package.json 的版本 $VERSION 对不上：验出来的东西对不上号"
            exit 1
          fi
          echo "tag=$TAG version=$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 下一个 step 的「现打」分支要拿 $TAG 去 checkout。只写进 GITHUB_OUTPUT 的话，
          # 那边 `set -euo pipefail` 一碰 $TAG 就是 unbound variable —— 2026-11-16 真路径
          # 第一趟就这么红的（红在拿包那步，还没摸到升级）。
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm ci
      # 两条路：能捞到那趟 run 的产物就不重新打包（那才是发版时真正发出去的东西）。
      - name: 拿本版 arm64 zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.pick.outputs.version }}"
          INNER="release/Solo-${VERSION}-arm64.zip"
          mkdir -p release
          RUN_ID="${{ inputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            echo "去捞 run $RUN_ID 的 mac-arm64 产物"
            mkdir -p artifact
            if GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh run download "$RUN_ID" -n mac-arm64 -D artifact; then
              FOUND=$(ls artifact/*-arm64.zip 2>/dev/null | head -1 || true)
              if [ -n "$FOUND" ]; then
                cp "$FOUND" "$INNER"
                echo "用捞到的那份：$FOUND"
              fi
            else
              echo "没捞到（run 太老、产物过期，或者 run_id 不对），改成现打一份"
            fi
          fi
          if [ ! -f "$INNER" ]; then
            # 现打这条路才需要 tag 的代码（不然打出来的是 main 的包、顶着 tag 的版本号，名不副实）。
            # 这时候连验收脚本也是 tag 里那版，日志里要能看出来。
            echo "没捞到产物：切到 ${TAG} 的代码现打一份——这趟连验收脚本都是 ${TAG} 那版，结论只代表那个版本"
            git checkout "$TAG"
            npm ci
            npm run ui:build
            # 和 release.yml 一样的理由：dmg 偶尔 hdiutil: create failed - Device not configured，
            # 机器层面的瞬时问题，失败一次就重打一次。
            npm run desktop:dist:mac || {
              echo "第一次 macOS 打包失败，重试…"
              npm run desktop:dist:mac
            }
          fi
          ls -l "$INNER"
      - name: 升级验收（段 3：整链下载替换重开）
        run: |
          set -euo pipefail
          VERSION="${{ steps.pick.outputs.version }}"
          NEW="release/Solo-${VERSION}-arm64.zip"
          if [ ! -f "$NEW" ]; then
            echo "没找到 $NEW"
            ls -l release || true
            exit 1
          fi
          # 私钥只在这一步活着：不管过没过，退出时都删掉，不留在 runner 上。
          umask 077
          KEY_PEM="$RUNNER_TEMP/solo-update-key.pem"
          printf '%s' "$SOLO_UPDATE_KEY" > "$KEY_PEM"
          trap 'rm -f "$KEY_PEM"' EXIT INT TERM
          # 给了 old_tag 就走真实升级路径：脚本自己去 Release 把那个旧包装下来当起点。
          # 不给就是替身（本版包改个 0.0.0-verify）—— 那种只验稳不稳，验不出「用户那条路上有坑」。
          OLD_TAG="${{ inputs.old_tag }}"
          if [ -n "$OLD_TAG" ]; then
            echo "真实升级路径：${OLD_TAG} → v${VERSION}（旧包脚本自己下）"
          else
            echo "替身路径：拿本版包改版本号当旧版（只验稳不稳）"
          fi
          # 用数组拼参数：`${VAR:+--flag "$VAR"}` 那种写法会把引号当字面字符传进去。
          ARGS=(--out update-upgrade-full --stages 3 --new-zip "$NEW" --key "$KEY_PEM")
          if [ -n "$OLD_TAG" ]; then
            ARGS+=(--old-tag "$OLD_TAG")
          fi
          # 把真正拼出来的参数打到日志：2026-11-15 那趟 old_tag=v2.9.19 明明 echo 了「真实升级路径」，
          # 脚本里却走了替身分支（`--old-tag` 没到 node）。光看脚本源码看不出差在哪，就看这一行的实际值。
          echo "ARGS 实际内容（方括号是我加的边界）：$(printf '[%s] ' "${ARGS[@]}")"
          # 同一批参数先喂给 node 自己，看它收到的 argv 到底长什么样、node 是哪个版本：
          # 本地用同样的参数跑是走真实路径的，CI 上却走替身，只能怀疑这一段。
          node -e 'console.log("node", process.version, "收到的 argv:", JSON.stringify(process.argv.slice(1)))' -- "${ARGS[@]}"
          node --experimental-strip-types scripts/verify-upgrade.mjs "${ARGS[@]}"
          # 「绿」得自己证。2026-11-15 真发生过一次假绿：上面那条 echo 里的 `$VERSION` 后面紧跟全角 `（`，
          # 当成变量名 `VERSION（`，`set -u` 报 unbound、脚本当场退出，可这一步照样标 success，
          # 日志里一行验收都没有。产物在才算跑过 —— 没有 core.log 就是一步没跑完。
          test -f update-upgrade-full/stage3-core.log || {
            echo "::error::段 3 一步都没跑完就退出了（没有 stage3-core.log），这次绿不算"
            exit 1
          }
          echo "段 3 产物：$(ls update-upgrade-full | tr '\n' ' ')"
        env:
          SOLO_UPDATE_KEY: ${{ secrets.SOLO_UPDATE_KEY }}
          # needOldZip() 在真旧版那条路上要 `gh release download`，读 Release 得带 token。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-verdict
          if-no-files-found: warn
          path: update-upgrade-full/
