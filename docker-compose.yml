# 一人公司 · Docker Compose
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# 打开 http://127.0.0.1:7788/（本机）或 http://<本机局域网 IP>:7788/（手机/同事）。
# 服务**没有鉴权**：只在可信内网使用，不要做公网端口映射。详见 docs/DEPLOY.md。

services:
  ai-company:
    build: .
    image: ai-company:latest
    container_name: ai-company
    restart: unless-stopped
    ports:
      # 只绑本机时改成 "127.0.0.1:7788:7788"
      - "7788:7788"
    volumes:
      # 数据库 / settings.json / uploads 都在这里。
      # 想直接看到文件可改成 bind mount：./workspace:/app/workspace
      # （Linux 上需先 mkdir -p workspace && sudo chown -R 1000:1000 workspace）
      - ai-company-workspace:/app/workspace
    environment:
      # 监听所有网卡，容器外才能访问
      AI_COMPANY_HOST: "0.0.0.0"
      PORT: "7788"
      # 模型接入（二选一，按需打开）：
      # AI_COMPANY_PROVIDER: "anthropic"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # 本地网关（默认）：容器里的 127.0.0.1 不是宿主机，需显式指向宿主机
      # COMMANDCODE_BASE_URL: "http://host.docker.internal:3425/v1"
      COMMANDCODE_BASE_URL: "http://host.docker.internal:3425/v1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7788/api/org').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ai-company-workspace:
